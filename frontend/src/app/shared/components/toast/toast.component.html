<div class="toast-stack" data-testid="toast-stack">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast toast--{{ toast.kind }}" >
        <span data-testid="toast-message">
          {{ toast.message }}
        </span>
      <button class="toast__close" (click)="toastService.dismiss(toast.id)" aria-label="Fechar">×</button>
    </div>
  }
</div>
